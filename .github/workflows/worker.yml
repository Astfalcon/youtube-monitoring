name: YouTube Monitor Worker

on:
  schedule:
    # Run every 15 minutes (UTC). Public repositories have unlimited Actions minutes.
    # Actual start times may be delayed by 5-15 minutes depending on GitHub load.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Enable the manual run button.
    inputs:
      no_mail:
        description: 'Skip sending notifications'
        required: false
        default: 'false'
      no_summary:
        description: 'Skip automatic summaries'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run worker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.no_mail }}" = "true" ]; then ARGS="$ARGS --no-mail"; fi
          if [ "${{ github.event.inputs.no_summary }}" = "true" ]; then ARGS="$ARGS --no-summary"; fi
          python worker.py $ARGS

      - name: Commit DB changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f youtube_monitor.db ]; then
            git add youtube_monitor.db
            if git diff --staged --quiet; then
              echo "No DB changes to commit."
            else
              git commit -m "[bot] worker run $(date -u +%FT%TZ)"
              git push
            fi
          else
            echo "youtube_monitor.db not found."
          fi

      - name: Keep Streamlit app awake (ping)
        # The free Streamlit Cloud plan sleeps when idle. Ping every 15 minutes to reset the timer.
        # This cannot wake an app that is already asleep. After a user wakes it once in a browser,
        # these pings help keep it awake.
        if: ${{ env.STREAMLIT_APP_URL != '' }}
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          echo "Pinging Streamlit app to reset sleep timer..."
          HTTP_CODE=$(curl -s -o /dev/null \
            -w "%{http_code}" \
            --max-time 30 \
            -A "Mozilla/5.0 (compatible; YouTube-Monitor-KeepAlive/1.0)" \
            "$STREAMLIT_APP_URL" || echo "000")
          echo "HTTP status: $HTTP_CODE"
          # Treat 200 (awake) and 303 (sleeping/redirect) as reached; both reset the sleep timer.
          case "$HTTP_CODE" in
            200|302|303)
              echo "App reached (status $HTTP_CODE) — sleep timer reset."
              ;;
            *)
              echo "Warning: unexpected status $HTTP_CODE (not failing workflow)."
              ;;
          esac
